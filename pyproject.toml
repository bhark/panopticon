[project]
name = "panopticon"
dynamic = ["version"]
description = "A harness where heterogeneous coding agents work toward one goal."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian E. Bratlann", email = "adrian@forn.dk" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = ["textual>=0.80", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/bhark/panopticon"
Repository = "https://github.com/bhark/panopticon"

[project.scripts]
panopticon = "panopticon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/panopticon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/panopticon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
